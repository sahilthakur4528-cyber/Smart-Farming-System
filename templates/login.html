<!DOCTYPE html>
<html>
<head>
    <title>Login - Smart Farming Advisory System</title>

    <style>

        body{
            margin:0;
            padding:0;
            font-family:Arial;
            background:#e8f5e9;
        }

        .container{
            width:400px;
            margin:70px auto;
            background:white;
            padding:25px;
            border-radius:10px;
            box-shadow:0px 0px 10px gray;
        }

        h1{
            text-align:center;
            color:green;
        }

        p{
            text-align:center;
        }

        label{
            font-weight:bold;
        }

        input{
            width:100%;
            padding:10px;
            margin-top:5px;
            margin-bottom:15px;
            border:1px solid gray;
            border-radius:5px;
            box-sizing:border-box;
        }

        button{
            width:100%;
            padding:12px;
            background:green;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
            font-size:16px;
        }

        button:hover{
            background:darkgreen;
        }

        .register{
            text-align:center;
            margin-top:20px;
        }

        a{
            text-decoration:none;
            color:green;
            font-weight:bold;
        }

    </style>

</head>

<body>

<div class="container">

<h1>🌱 Smart Farming</h1>

<p>Login to Continue</p>

<form action="/login" method="POST">

<label>Email</label>
<input type="email" name="email" required>

<label>Password</label>
<input type="password" name="password" required>

<button type="submit">Login</button>

</form>

<div class="register">

Don't have an account?

<br><br>

<a href="/register">Register Here</a>

</div>

</div>

</body>
</html>
