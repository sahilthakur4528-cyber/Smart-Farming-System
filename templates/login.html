<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - Smart Farming Advisory System</title>


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


<style>


*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}



body{

    display:flex;
    justify-content:center;
    align-items:center;

    min-height:100vh;

    background:linear-gradient(
        135deg,
        #dff6dd,
        #c8f0c6,
        #e8f9e7
    );

}



/* Login Box */

.container{

    width:360px;

    background:white;

    padding:35px 30px;

    border-radius:18px;

    box-shadow:0 10px 30px rgba(0,0,0,.15);

    text-align:center;

    animation:fade .7s;

}



@keyframes fade{

    from{

        opacity:0;

        transform:translateY(-25px);

    }

    to{

        opacity:1;

        transform:translateY(0);

    }

}



/* Logo */

.logo{

    font-size:45px;

    color:#2e7d32;

    margin-bottom:8px;

}



h1{

    color:#2e7d32;

    font-size:30px;

    margin-bottom:5px;

}



p{

    color:#666;

    margin-bottom:25px;

    font-size:15px;

}



/* Input */

.input-box{

    position:relative;

    margin-bottom:18px;

}



.input-box i{

    position:absolute;

    left:15px;

    top:50%;

    transform:translateY(-50%);

    color:#2e7d32;

}



.input-box input{

    width:100%;

    padding:13px 45px;

    border:1px solid #ccc;

    border-radius:10px;

    font-size:15px;

    outline:none;

    transition:.3s;

}



.input-box input:focus{

    border-color:#2e7d32;

    box-shadow:0 0 8px rgba(46,125,50,.3);

}



.eye{

    position:absolute;

    right:15px;

    top:50%;

    transform:translateY(-50%);

    cursor:pointer;

    color:#666;

}



/* Button */

button{

    width:100%;

    padding:13px;

    border:none;

    border-radius:10px;

    background:linear-gradient(
        to right,
        #2e7d32,
        #4caf50
    );

    color:white;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

    transition:.3s;

}



button:hover{

    transform:translateY(-2px);

    box-shadow:0 6px 15px rgba(0,128,0,.3);

}



/* Register */

.register{

    margin-top:20px;

    font-size:15px;

    color:#555;

}



.register a{

    text-decoration:none;

    color:#2e7d32;

    font-weight:bold;

}



.register a:hover{

    text-decoration:underline;

}



/* Mobile */

@media(max-width:450px){

    .container{

        width:90%;

        padding:30px 20px;

    }

}


</style>


</head>


<body>


<div class="container">


<div class="logo">

<i class="fas fa-seedling"></i>

</div>



<h1>Smart Farming</h1>


<p>Login to Continue</p>



<form action="/login" method="POST">



<div class="input-box">

<i class="fas fa-envelope"></i>


<input 
type="email"
name="email"
placeholder="Enter Email"
required>


</div>



<div class="input-box">


<i class="fas fa-lock"></i>


<input 
type="password"
name="password"
id="password"
placeholder="Enter Password"
required>


<i class="fas fa-eye eye" onclick="showPassword()"></i>


</div>



<button type="submit">

Login

</button>



</form>




<div class="register">

Don't have an account?

<br><br>


<a href="/register">

Register Here

</a>


</div>



</div>




<script>


function showPassword(){


let password=document.getElementById("password");


if(password.type==="password"){

    password.type="text";

}

else{

    password.type="password";

}


}


</script>



</body>

</html>
