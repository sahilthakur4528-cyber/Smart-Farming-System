<!DOCTYPE html>
<html>
<head>
<title>Crop Recommendation</title>

<style>

body{
    font-family:Arial;
    background:#e8f5e9;
}

.container{

    width:500px;
    margin:30px auto;
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0px 0px 10px gray;

}

h2{

    text-align:center;
    color:green;

}

input{

    width:100%;
    padding:10px;
    margin-bottom:15px;
    box-sizing:border-box;

}

button{

    width:100%;
    padding:12px;
    background:green;
    color:white;
    border:none;
    font-size:16px;
    cursor:pointer;

}

button:hover{

    background:darkgreen;

}

</style>

</head>

<body>

<div class="container">

<h2>🌾 Crop Recommendation</h2>

<form action="/prediction" method="POST">

<label>Nitrogen (N)</label>
<input type="number" name="nitrogen" required>

<label>Phosphorus (P)</label>
<input type="number" name="phosphorus" required>

<label>Potassium (K)</label>
<input type="number" name="potassium" required>

<label>Temperature (°C)</label>
<input type="number" step="0.1" name="temperature" required>

<label>Humidity (%)</label>
<input type="number" step="0.1" name="humidity" required>

<label>pH Value</label>
<input type="number" step="0.1" name="ph" required>

<label>Rainfall (mm)</label>
<input type="number" step="0.1" name="rainfall" required>

<button type="submit">🌾 Predict Crop</button>

</form>

</div>

</body>
</html>
