<!DOCTYPE html>
<html>
<head>
    <title>Register - Smart Farming Advisory System</title>

    <style>

        body{
            margin:0;
            padding:0;
            font-family:Arial;
            background:#e8f5e9;
        }

        .container{
            width:400px;
            margin:40px auto;
            background:white;
            padding:25px;
            border-radius:10px;
            box-shadow:0px 0px 10px gray;
        }

        h1{
            text-align:center;
            color:green;
        }

        p{
            text-align:center;
        }

        label{
            font-weight:bold;
        }

        input{
            width:100%;
            padding:10px;
            margin-top:5px;
            margin-bottom:15px;
            border:1px solid gray;
            border-radius:5px;
            box-sizing:border-box;
        }

        button{
            width:100%;
            padding:12px;
            background:green;
            color:white;
            border:none;
            border-radius:5px;
            font-size:16px;
            cursor:pointer;
        }

        button:hover{
            background:darkgreen;
        }

        a{
            text-decoration:none;
            color:green;
            font-weight:bold;
        }

        .login{
            text-align:center;
            margin-top:20px;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>🌱 Smart Farming</h1>

    <p>Create Your Account</p>

    <form action="/register" method="POST">

        <label>Full Name</label>
        <input type="text" name="fullname" required>

        <label>Email</label>
        <input type="email" name="email" required>

        <label>Mobile Number</label>
        <input type="text" name="mobile" maxlength="10" required>

        <label>Password</label>
        <input type="password" name="password" required>

        <label>Confirm Password</label>
        <input type="password" name="confirm_password" required>

        <button type="submit">Register</button>

    </form>

    <div class="login">
        Already have an account?
        <br><br>
        <a href="/login">Login Here</a>
    </div>

</div>

</body>
</html>
