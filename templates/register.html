<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Register - Smart Farming Advisory System</title>

<style>

/* Reset */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}


/* Background */

body{

    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;

    background:linear-gradient(
        -45deg,
        #dff6dd,
        #b8e994,
        #dff6dd,
        #c8f7c5
    );

    background-size:400% 400%;
    animation:bg 10s ease infinite;

}


@keyframes bg{

    0%{
        background-position:0% 50%;
    }

    50%{
        background-position:100% 50%;
    }

    100%{
        background-position:0% 50%;
    }

}



/* Register Box */

.container{

    width:400px;

    background:white;

    padding:30px;

    border-radius:18px;

    box-shadow:0 10px 30px rgba(0,0,0,0.2);

    animation:popup .8s;

}



@keyframes popup{

    from{

        opacity:0;

        transform:translateY(40px) scale(.9);

    }

    to{

        opacity:1;

        transform:translateY(0) scale(1);

    }

}



/* Heading */

h1{

    text-align:center;

    color:#2e7d32;

    margin-bottom:8px;

}


p{

    text-align:center;

    color:#555;

    margin-bottom:25px;

}



/* Form */

label{

    display:block;

    font-weight:bold;

    color:#333;

    margin-bottom:6px;

}


input{

    width:100%;

    padding:12px;

    margin-bottom:18px;

    border:1px solid #ccc;

    border-radius:8px;

    outline:none;

    font-size:15px;

    transition:.3s;

}



input:focus{

    border-color:#2e7d32;

    box-shadow:0 0 10px rgba(46,125,50,.3);

}



/* Button */

button{

    width:100%;

    padding:13px;

    border:none;

    border-radius:8px;

    background:linear-gradient(
        to right,
        #2e7d32,
        #43a047
    );

    color:white;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

    transition:.3s;

}



button:hover{

    transform:translateY(-2px);

    box-shadow:0 8px 18px rgba(46,125,50,.3);

}



/* Login Link */

.login{

    text-align:center;

    margin-top:20px;

    color:#555;

}


.login a{

    color:#2e7d32;

    text-decoration:none;

    font-weight:bold;

}


.login a:hover{

    text-decoration:underline;

}



/* Mobile Responsive */

@media(max-width:450px){

    .container{

        width:90%;

        padding:25px;

    }


    h1{

        font-size:26px;

    }

}


</style>

</head>


<body>


<div class="container">


<h1>🌱 Smart Farming</h1>

<p>Create Your Account</p>



<form action="/register" method="POST">


<label>Full Name</label>

<input 
type="text" 
name="fullname" 
placeholder="Enter Full Name"
required>



<label>Email</label>

<input 
type="email" 
name="email" 
placeholder="Enter Email"
required>



<label>Mobile Number</label>

<input 
type="tel" 
name="mobile" 
placeholder="Enter Mobile Number"
pattern="[0-9]{10}"
maxlength="10"
required>



<label>Password</label>

<input 
type="password" 
name="password"
placeholder="Enter Password"
required>



<label>Confirm Password</label>

<input 
type="password" 
name="confirm_password"
placeholder="Confirm Password"
required>



<button type="submit">
Create Account
</button>



</form>



<div class="login">

Already have an account?

<br><br>

<a href="/login">
Login Here
</a>


</div>



</div>


</body>

</html>
