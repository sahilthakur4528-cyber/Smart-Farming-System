<!DOCTYPE html>
<html>

<head>

<title>Prediction Result</title>

<style>

body{

font-family:Arial;
background:#e8f5e9;

}

.container{

width:550px;
margin:40px auto;
background:white;
padding:25px;
border-radius:10px;
box-shadow:0px 0px 10px gray;

}

h2{

color:green;
text-align:center;

}

.result-box{

background:#f8fff8;
padding:15px;
border-left:5px solid green;
margin-bottom:15px;
border-radius:5px;

}

p{

font-size:18px;
margin:12px 0;

}

button{

width:100%;
padding:12px;
background:green;
color:white;
border:none;
font-size:16px;
cursor:pointer;
border-radius:5px;

}

button:hover{

background:darkgreen;

}

.footer{

margin-top:25px;
text-align:center;
color:green;
font-weight:bold;

}

</style>

</head>

<body>

<div class="container">

<h2>🌾 Smart Farming Prediction Result</h2>

<div class="result-box">

<p><b>🌾 Recommended Crop:</b> {{ crop }}</p>

<p><b>🌱 Recommended Fertilizer:</b> {{ fertilizer }}</p>

<p><b>📦 Quantity:</b> {{ quantity }}</p>

<p><b>🧪 Application Method:</b> {{ method }}</p>

<p><b>💧 Irrigation Advice:</b> {{ irrigation }}</p>

</div>

<a href="/download_pdf">

<button>
📄 Download Report as PDF
</button>

</a>

<div class="footer">

🌾 Wishing You a Healthy Crop and Good Harvest! 🌾

</div>

</div>

</body>

</html>
